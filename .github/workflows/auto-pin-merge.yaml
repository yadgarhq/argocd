name: auto-pin-merge

# MERGE AN AUTOMATIC PIN PR ONCE EVERY CHECK HOLDS (ledger 1632 C6; ADR-0946,
# ADR-0948, ADR-1004, ADR-1015). The plan is `yadgarhq/docs`
# `plans/auto-deploy-parent-chart.md`, section 4 ("Auto-merge"). Every
# decision lives in `scripts/auto_pin_merge.py` (its docstring has the
# predicate), tested offline in `scripts/tests/test_auto_pin_merge.py`. This
# file runs it at argocd `main`.
#
# OFF UNLESS `vars.AUTO_PIN_MERGE == 'true'` (the comparison with 'true'
# matters: a bare variable is truthy for the string "false"). With it off, no
# job runs and no token is minted. ADR-1004: it is set only after the first
# automatic pin PR goes fully green with merging off.
#
# THE BOT MERGES, NOT GITHUB AUTO-MERGE: auto-merge cannot re-check the hold
# issue or main's settled verdict at the moment it merges. It gates on the
# statuses, the marker and the argocd-verify run, NEVER on a label, and it
# never calls update-branch: a base that moved is regenerated by
# `auto-pin.yaml` (`regenerate: <n>`) as a new single commit with its own E2.
#
# TRIGGERS: the schedule and a manual dispatch, both at `main` only. Each
# pass re-checks every open automatic PR, so a `regenerate` dispatch that the
# `auto-pin` concurrency group evicted is dispatched again on the next pass.
# NO `workflow_run` (the plan's prompt path): zizmor's `dangerous-triggers`
# audit refuses it in `ci / workflows`, and this repository suppresses no
# zizmor finding. The cost is latency only: a green PR waits for the next
# cron start (GitHub throttles cron here to every few hours at worst), and
# the merge re-reads everything at that moment anyway.
#
# IDENTITIES (plan section 7):
#   this job's GITHUB_TOKEN: read argocd (PRs, files, statuses, check runs,
#     hold issues) and dispatch `auto-pin.yaml` (`actions: write`);
#   `yadgarhq-settled-dispatch` (R4), argocd-verify only, actions read and
#     contents read (ADR-1015): main's settled verdict and the E2 run the
#     status names (yaadgaar #420: only this App starts that run);
#   release App `yadgarhq-bot` (R3-a), argocd only, contents and
#     pull-requests write: the merge. A merge made with GITHUB_TOKEN would
#     start no workflow, and settled-dispatch must run on it.
#
# THESE LOGS ARE PUBLIC: the script prints PR numbers, shas, run ids and
# reasons only.

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  merge:
    name: merge a green automatic pin PR
    if: vars.AUTO_PIN_MERGE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: auto-pin-merge
      cancel-in-progress: false
    permissions:
      actions: write
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - name: check out main, read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          # Full history: the settled epoch's anchor A is found by walking it.
          fetch-depth: 0

      # Pinned, not "3.x": the hash-pinned PyYAML 6.0.3 has wheels up to CPython 3.14.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: install PyYAML and pytest (hash-pinned, wheels only)
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes \
            --only-binary=:all: -r scripts/auto_pin.requirements.txt

      - name: mint a token for argocd-verify (actions read, contents read)
        id: verify
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SETTLED_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SETTLED_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: argocd-verify
          permission-actions: read
          permission-contents: read

      - name: mint a release App token (argocd, contents and pull-requests write), for the merge
        id: pin
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: argocd
          permission-contents: write
          permission-pull-requests: write

      - name: judge every open automatic pin PR, then merge or regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_TOKEN: ${{ steps.verify.outputs.token }}
          PIN_TOKEN: ${{ steps.pin.outputs.token }}
        run: python3 scripts/auto_pin_merge.py --repo .
