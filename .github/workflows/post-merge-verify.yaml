name: post-merge-verify

# AFTER EACH MERGE TO `main`, PROVE ROOT'S SYNC RECREATED NOTHING.
#
# `scripts/verify_handover.py` waits for root to be Synced at the merge sha, then
# for every Application under root to settle, then snapshots, then diffs against
# the snapshot the previous run left. It reads the cluster only, as the
# `post-merge-verifier` ServiceAccount that `applications/post-merge-verifier.yaml`
# syncs: get/list/watch, no Secrets.
#
# INERT UNTIL A PERSON SWITCHES IT ON. No runner exists for this repository yet.
# The only ARC scale set on kind-yadgar, `estate-front`, registers against
# `yadgarhq/estate` and its namespace's egress policy excludes the API server,
# so it cannot serve this job. MIGRATION_NOTES.md ("The post-merge verifier")
# proposes a dedicated scale set, `argocd-verify`. Until it exists and the
# repository variable `POST_MERGE_VERIFY` is `true`, the job is skipped. A job
# naming a label no runner carries would otherwise queue for a day on every push.
#
# THE BASELINE IS THE PREVIOUS RUN'S AFTER SNAPSHOT, NOT A PRE-MERGE SNAPSHOT.
# A pre-merge job would run pull-request code on a runner that holds a cluster
# credential, and its snapshot goes stale between review and merge. The cost:
# each diff covers ALL change since the last snapshot, so drift between merges
# is reported against the next merge. The diff names every change, so that is a
# finding to read, not a false verdict. The first run has no baseline and says
# so in its summary; it is not a pass.
#
# PENDING RUNS ARE REPLACED, NOT QUEUED. `concurrency` keeps one run going and at
# most one pending; a newer push replaces the pending one. That is why the
# baseline is the LATEST snapshot artifact rather than "run N-1's".
#
# A FAILURE IS REPORTED ONCE. The AFTER snapshot is uploaded even when the diff
# fails, so the next run compares against the changed state. The red run stays
# in the history; it is the record.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: post-merge-verify
  cancel-in-progress: false

jobs:
  verify:
    name: post-merge verify
    if: vars.POST_MERGE_VERIFY == 'true'
    # `runnerScaleSetName` of the proposed scale set; declared in
    # .github/actionlint.yaml so a typo here still fails the lint.
    runs-on: argocd-verify
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # list and download the previous run's snapshot artifact
    env:
      CONTEXT: in-cluster-verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # Pinned and checksummed: the runner image carries no kubectl.
      - name: install kubectl
        env:
          KUBECTL_VERSION: v1.36.1
          KUBECTL_SHA256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # A named context over the pod's own ServiceAccount token, and NO
      # current-context: a kubectl call without `--context` fails here too.
      # `tokenFile`, so the token is never copied into a file or the log.
      - name: write kubeconfig
        run: |
          set -euo pipefail
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          test -r "$sa/token" || { echo "::error::no ServiceAccount token mounted; is the runner pod's serviceAccountName post-merge-verifier?"; exit 1; }
          KUBECONFIG="$RUNNER_TEMP/verifier.kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          cat > "$KUBECONFIG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: in-cluster
              cluster:
                server: https://kubernetes.default.svc
                certificate-authority: $sa/ca.crt
          users:
            - name: post-merge-verifier
              user:
                tokenFile: $sa/token
          contexts:
            - name: $CONTEXT
              context:
                cluster: in-cluster
                user: post-merge-verifier
          EOF

      - name: find the previous snapshot
        id: baseline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "post-merge-snapshot",
              per_page: 100,
            });
            const usable = artifacts
              .filter((a) => !a.expired && a.workflow_run && a.workflow_run.head_branch === "main" && a.workflow_run.id !== context.runId)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            if (usable.length === 0) {
              core.warning("no previous post-merge-snapshot artifact: this run records a baseline and compares nothing");
              core.setOutput("found", "false");
              return;
            }
            core.info(`baseline: artifact ${usable[0].id} from run ${usable[0].workflow_run.id}, created ${usable[0].created_at}`);
            core.setOutput("found", "true");
            core.setOutput("artifact_id", String(usable[0].id));
            core.setOutput("run_id", String(usable[0].workflow_run.id));

      - name: download the previous snapshot
        if: steps.baseline.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.baseline.outputs.artifact_id }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/before

      # Root first: Synced at the merge sha with no operation running. A merge
      # that changes nothing root renders starts no operation, so none is
      # required.
      - name: wait for root at the merge sha
        run: |
          set -euo pipefail
          python3 scripts/verify_handover.py wait --context "$CONTEXT" --app root --revision "$GITHUB_SHA" --timeout 900
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/root-synced-at"

      # Then every Application under root: reconciled after root reached the
      # sha, Healthy, no operation running, and Synced when automated. Longer
      # than Argo's 180s reconcile period, so each one is re-read at least once.
      - name: wait for every Application to settle
        run: |
          set -euo pipefail
          python3 scripts/verify_handover.py wait --context "$CONTEXT" --settled --since "$(cat "$RUNNER_TEMP/root-synced-at")" --timeout 900

      - name: snapshot
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/after"
          python3 scripts/verify_handover.py snapshot --context "$CONTEXT" --out "$RUNNER_TEMP/after/snapshot.json"

      - name: keep the snapshot as the next run's baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-merge-snapshot
          path: ${{ runner.temp }}/after/snapshot.json
          if-no-files-found: error
          retention-days: 90

      - name: diff against the previous snapshot
        env:
          FOUND: ${{ steps.baseline.outputs.found }}
        run: |
          set -euo pipefail
          if [ "$FOUND" != "true" ]; then
            {
              echo "## post-merge-verify: BASELINE ONLY"
              echo
              echo "No previous snapshot artifact. This run recorded one and compared nothing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::baseline only: nothing was compared"
            exit 0
          fi
          set +e
          python3 scripts/verify_handover.py diff "$RUNNER_TEMP/before/snapshot.json" "$RUNNER_TEMP/after/snapshot.json" > "$RUNNER_TEMP/diff.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/diff.txt"
          {
            echo "## post-merge-verify: exit $status"
            echo
            echo '```'
            cat "$RUNNER_TEMP/diff.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
