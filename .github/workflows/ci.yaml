name: ci

# CI is defined once in yadgarhq/actions (D62). This file is the whole of this
# repository's CI configuration: the shared workflow detects what the repository
# is and runs what applies.
#
# NO WORKFLOW-LEVEL `permissions:` BLOCK, deliberately. A job cannot ask for more
# than the workflow grants, so a top-level `contents: read` makes the release
# job's `packages: write` invalid — and the failure is a run with ZERO JOBS and
# no logs, which says nothing about permissions. Each job states its own instead.
#
# Push to main runs the version report only. Validating there would re-run what
# the pull request just passed, on code already merged, with nobody watching.
#
# ONE ACTOR PUSHES TO `main` DIRECTLY HERE, AND IT IS NOT A PERSON. Once the
# release App is a bypass actor on this repository's `main` ruleset, `ci-release`
# writes `versions/<module>.yaml` on every module release with no pull request —
# that is what the bypass is for, and it is why this comment no longer says
# direct pushes are impossible. Those commits are machine-written and touch
# nothing this file validates, so there is still no drift for a push-path
# validation to catch.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  # THE PULL REQUEST GATE, AND IT CARRIES NO CREDENTIAL. `ci-pr.yaml` serves both
  # events, so one job calling it for both handed the release App's private key
  # to every pull-request run — a run that builds and tests the branch's own
  # code. These are branch pull requests rather than fork ones, so GitHub does
  # pass secrets to them, and the App holds `Contents: Read and write` on every
  # repository in the organisation.
  #
  # The pull request has no use for it either: `version` is the only job that
  # reads those secrets, and its own condition is `push` to `refs/heads/main`.
  # So the split costs nothing and removes the whole exposure.
  #
  # THE NAME `ci` IS LOAD-BEARING. The ruleset on `main` requires the check
  # `ci / passed`, which is `<caller job id> / <called job id>` — renaming this
  # job breaks the merge gate rather than reporting anything.
  #
  # `needs:` FOLDS THIS REPOSITORY'S OWN NETWORK GATES INTO THAT ONE REQUIRED
  # CHECK, with no ruleset change. `signature` and `two-owners` (below) came
  # with the five Applications `infra` released (ADR-0824). `passed` is a job
  # INSIDE the shared workflow, so its own `needs:` cannot name a job here;
  # this caller job can. If either gate fails, this job is skipped, the shared
  # workflow never runs, and `ci / passed` is never reported. The ruleset then
  # waits for a check that never arrives, so the pull request cannot merge.
  # It reads as "expected, waiting", not as a red `ci / passed` — the red is
  # on the failed gate itself. The cost is time: the shared checks start only
  # after both gates finish.
  ci:
    if: github.event_name == 'pull_request'
    needs: [signature, two-owners]
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
      checks: read

  # THE SAME SHARED WORKFLOW ON THE PUSH PATH, where the credential is needed
  # and where nothing unreviewed runs. A push to `main` here is EITHER a merge
  # that has already passed `ci / passed`, OR the release App writing a version
  # file under its ruleset bypass — machine-written, with no reviewable content.
  # The ruleset forbids every other kind.
  #
  # THE VERSION JOB IS INERT HERE EITHER WAY. This repository carries no `v*`
  # tag, so the derivation finds no baseline and writes nothing, and the App's
  # commit message is not bullet-shaped. A module's release cannot tag this
  # repository.
  #
  # NAMED RATHER THAN `secrets: inherit`, and that is the estate's own tooling
  # deciding rather than a preference. `inherit` was the chosen form — same
  # organisation, same control, one line instead of three — and zizmor's
  # `secrets-inherit` audit fails it at High confidence, which reddens the
  # `ci / workflows` job of this very workflow. The audit is right about why:
  # inherit passes every organisation and repository secret the caller can see,
  # not the two the callee declares, and it GROWS SILENTLY, since a secret added
  # to the organisation later would flow into this call with nobody editing this
  # file. Naming the two is the fix the audit asks for, not a suppression of it.
  main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: yadgarhq/actions/.github/workflows/ci-pr.yaml@main
    permissions:
      contents: read
      checks: read
    secrets:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: yadgarhq/actions/.github/workflows/ci-release.yaml@main
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write

  # LEDGER 1206. `scripts/chart_pin.json`'s `platform_version` is read by
  # `scripts/tests/test_operator_applications.py` with no network, so that gate
  # alone cannot tell "committed value is still true" from "committed value went
  # stale while nobody told it". This job makes the two requests that can —
  # `scripts/check_chart_pin.py`'s own module docstring has the full argument,
  # this is the short form:
  #
  #   platform-version  reads `yadgarhq/chart@<chart_tag>`'s `chart/Chart.yaml`
  #                      and fails if `platform`'s pinned version there has
  #                      moved away from what is committed.
  #   chart-tag          reads this repository's own `applications/yadgar.yaml`
  #                      for the `targetRevision` the running `yadgar`
  #                      Application actually pins, and fails if `chart_tag`
  #                      disagrees. A git tag never moves, so
  #                      `platform-version` ALONE cannot detect `chart_pin.json`
  #                      going stale after this organisation moves to a newer
  #                      chart release — this is the half that can. It read
  #                      `yadgarhq/deploy`'s `infra/yadgar-app.yaml` over the
  #                      network until that Application moved here (option A,
  #                      ADR-0824); now it is a local read, and
  #                      `scripts/tests/test_check_chart_pin.py` covers it
  #                      offline in the `operator-applications` hook.
  #
  # NOT A PRE-COMMIT HOOK, UNLIKE `operator-applications`. That hook's whole
  # point (`versions-pinned`'s own comment makes the same argument) is that what
  # a developer runs locally is what CI runs — which requires no network call a
  # developer might not have. The platform-version half needs one, so the
  # script runs here instead, LOCAL TO THIS REPOSITORY rather than in
  # `yadgarhq/actions`: no other repository carries a `chart_pin.json`.
  #
  # THIS IS NOT THE REQUIRED CHECK. `main`'s ruleset gates on `ci / passed`
  # alone (the comment on the `ci` job above), so a red `chart-pin` here is a
  # visible signal, not a merge block — same posture `ci-pr.yaml`'s own
  # `ci / workflows` zizmor job takes on this very file.
  #
  # `GITHUB_TOKEN` ONLY RAISES THE RATE LIMIT. `yadgarhq/chart` is a public
  # repository (checked by hand, `gh api repos/yadgarhq/chart --jq .private` →
  # `false`), so a default `GITHUB_TOKEN` — scoped read-only to THIS
  # repository's own `contents` — reads it exactly as an unauthenticated
  # request would; the token is passed because it costs nothing.
  # `scripts/check_chart_pin.py` never prints the token.
  chart-pin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: install pyyaml
        run: pip install --quiet pyyaml==6.0.3

      - name: chart_pin.json matches yadgarhq/chart and the running yadgar Application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_chart_pin.py

  # PORTED FROM yadgarhq/deploy WITH ITS SUBJECT (retiring `infra`, option A,
  # ADR-0824). `applications/estate-front-runner.yaml` pins the ARC runner pod
  # to a digest `yadgarhq/actions`' `estate-runner image` workflow published;
  # `scripts/runner_image_pinned.py` checks the pin offline as the
  # `runner-image-pinned` pre-commit hook, and THIS job asks cosign whether CI
  # signed it. Not a hook, because a hook may not depend on a registry.
  #
  # A MERGE GATE THROUGH `ci`'s `needs:` (above), not through the ruleset.
  # PULL REQUESTS ONLY: on `push` to main it would re-ask, against merged
  # code, a question the pull request just answered.
  signature:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: install PyYAML
        run: python3 -m pip install --disable-pip-version-check "pyyaml==6.0.3"

      # THE SAME PIN THE PUBLISHING WORKFLOW USES. `yadgarhq/actions`'s
      # `estate-runner image` workflow signs with this action at this digest;
      # verifying with a different cosign major is a question nobody asked.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # NO REGISTRY CREDENTIAL, DELIBERATELY, and it matches how the pod pulls.
      # `applications/estate-front-runner.yaml` carries no `imagePullSecrets`
      # and the package is public (ledger 661), so an anonymous verify asks the
      # same question the kubelet asks. A verify that only works when
      # authenticated would stay green through a visibility flip that the
      # cluster experiences as ImagePullBackOff.
      - name: the pinned digest carries CI's signature
        run: python3 scripts/runner_image_pinned.py --verify-signature

  # THE TWO-OWNERS GATE AND THE `yadgar` APPLICATION'S SHAPE, ported from
  # yadgarhq/deploy with their subject (retiring `infra`, ADR-0824).
  # `scripts/gates/test_no_two_owners.py`: no object in namespace `yadgar` has
  # two owners. `scripts/gates/test_yadgar_application.py`:
  # `applications/yadgar.yaml` is the chart's own example outside `syncPolicy`
  # and `valuesObject` (E3), and its render equals the committed per-object
  # digests (K3).
  #
  # NOT A PRE-COMMIT HOOK. Both need helm and the registry (`helm pull` of the
  # pinned parent), and the example is read from `yadgarhq/chart` at the pinned
  # tag. That is why they live in `scripts/gates/`, outside the path the
  # offline `operator-applications` hook runs (`scripts/tests`).
  #
  # A MERGE GATE THROUGH `ci`'s `needs:` (above). PULL REQUESTS ONLY.
  two-owners:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # The same pytest the `operator-applications` hook pins.
      - name: install PyYAML and pytest
        run: |
          python3 -m pip install --disable-pip-version-check \
            "pyyaml==6.0.3" "pytest==9.1.1"

      # NO REGISTRY CREDENTIAL. The parent chart and every module package are
      # public, so the pull is anonymous — the same pull an adopter makes.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # THE HELM ARGO CD v3.1.8 BUNDLES, and the one `yadgarhq/chart`
          # renders the parent with.
          version: v3.18.4

      - name: no object in namespace yadgar has two owners, and yadgar is the example
        run: python3 -m pytest scripts/gates -q
