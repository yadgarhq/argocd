# ADOPTED FROM yadgarhq/deploy AT E3 OF THE OPERATORS HANDOVER (ADR-0824), and
# SOURCED FROM yadgarhq's `platform` CHART SINCE D4. Root adopts the live
# Application by name, keeping its uid.
#
# WHAT D4 CHANGED, AND ONLY THIS: `source`. It was Envoy's own chart,
# `gateway-helm` 1.9.1 from oci://docker.io/envoyproxy. It is now `platform` at
# the version `yadgarhq/chart@v0.3.15` embeds, with
# `operators.envoyGateway.create` true and every other operator explicitly
# false. `platform` 0.1.21 carries the same Envoy Gateway v1.9.1 as its
# `gateway-helm` subchart, so the image tags do not move. The subchart's own
# version string is `v1.9.1`, not `1.9.1`, so the `helm.sh/chart` label moves
# from `gateway-helm-1.9.1` to `gateway-helm-v1.9.1` on 17 objects. That label is
# in no selector and no pod template, so nothing rolls. Ten of the 17 are
# ordinary objects, which Argo patches in place. The other 7 are helm hooks,
# which Argo does not patch (below).
#
# WHAT D4 KEPT, so that the handover adopts in place: the Application name, the
# destination namespace `envoy-gateway-system`, `syncPolicy`, and no
# `releaseName`. Argo uses the Application name as the helm release name, so the
# release stays `envoy-gateway`, `app.kubernetes.io/instance` stays
# `envoy-gateway`, and no immutable Deployment selector changes. Measured
# 2026-10-01 with both sources rendered as release `envoy-gateway` in namespace
# `envoy-gateway-system`: the same 40 objects, and the only difference is that
# label. The Deployment's selector and pod template are equal, and the 21 CRDs
# (Envoy Gateway's own and Gateway API v1.6.1 experimental) have equal `spec`.
# `platform` 0.1.21's Chart.yaml and Chart.lock pin `gateway-helm` at v1.9.1.
#
# EACH OPERATOR KEY IS WRITTEN, NOT LEFT UNSET. `platform` resolves an unset
# `operators.<op>.create` through `operators.create`, so an unset key is a
# second place that decides what this Application installs.
#
# THE `gateway-helm:` VALUES ARE deploy's, moved under `platform`'s subchart key
# unchanged: the development sizing (D55). Without it the envoy-gateway
# Deployment's pod template falls back to the chart's defaults, and it rolls.
#
# THE `certgen` HOOK RE-RUNS ON THE SWAP AND ROTATES NOTHING. gateway-helm's
# `certgen` Job, its RBAC and the topology-injector MutatingWebhookConfiguration
# are helm `pre-install, pre-upgrade` hooks, which Argo runs as PreSync on the
# sync this change triggers: the label change puts the Application OutOfSync,
# and automated sync runs every hook. None sets a delete policy, so Argo
# deletes and recreates the 6 that exist live: the 5 certgen RBAC objects and
# the webhook. The certgen Job sets `ttlSecondsAfterFinished: 30` and no longer
# exists live, so Argo only creates it. In v1.9.1 `envoy-gateway certgen` writes the
# control-plane Secrets (`envoy-gateway`, `envoy`, `envoy-rate-limit`,
# `envoy-oidc-hmac`) through `CreateOrUpdateSecrets` with `update` set only by
# `--overwrite`. The rendered Job passes no arguments, so an existing Secret is
# skipped and the xDS CA the edge proxies trust stays as it is. certgen then
# sets the recreated webhook's `caBundle` from the existing `envoy-gateway`
# Secret. Until it does, the `caBundle` is empty; the webhook is
# `failurePolicy: Ignore` and matches only `pods/binding` in this namespace. Read from the
# v1.9.1 source (internal/cmd/certgen.go, internal/provider/kubernetes/secrets.go)
# and the render, 2026-10-01.
#
# `syncPolicy` is S0 of the operators handover (ADR-0824): `automated.prune` is
# omitted, and `retry` is copied from `yadgarhq/chart@v0.3.15`'s
# `example/operators-application.yaml`. No `Prune=false` here: root's apply
# removes the one E1 left on the live object.
#
# WHAT IS GATED, AND WHAT IS ONLY MEASURED.
# scripts/tests/test_operator_applications.py pins this Application's shape:
# the source, the platform version, every operator key, the carried values, the
# absent `releaseName`, and every field outside `source`. It does not render
# anything. The 40-object render equivalence, the one label difference, the CRD
# equality, `platform` 0.1.21 embedding Envoy Gateway v1.9.1, and certgen's
# skip-if-present behaviour are a 2026-10-01 measurement, recorded in the pull
# request that made this change, and no check re-runs them.
#
# Envoy Gateway — the Gateway API implementation that terminates TLS at the edge
# (D71).
#
# GATEWAY API RATHER THAN INGRESS, and this is forced rather than preferred.
# Ingress NGINX was RETIRED in March 2026 by the Kubernetes Steering and Security
# Response Committees — no releases, no bug fixes, no CVE patches — and the
# `Ingress` API itself is frozen, with Kubernetes' own documentation now pointing
# at Gateway instead. Either would have meant adopting a dead API and an
# unpatched controller on day one.
#
# WHY THIS IMPLEMENTATION. Apache-2.0, part of the Envoy project rather than a
# single vendor, and single-purpose. NGINX Gateway Fabric would work and is the
# one implementation with a TYPED hostPort field, which would have avoided the
# cluster's port remap — but choosing the gateway for ~61 services on the basis
# of which one can bind a host port inside kind is letting a development-cluster
# quirk drive a production decision. The remap was the cheaper thing to change.
# **Rejected:** kgateway (CNCF Sandbox, Envoy-based, but hostPort only through an
# unvalidated strategic-merge overlay and no DaemonSet mode); Traefik (bundles a
# proxy, dashboard and middleware surface nothing here needs); Cilium (conformant,
# but it is a CNI replacement — swapping a working cluster's network layer to
# terminate one TLS listener is not proportionate).
#
# IT INSTALLS THE GATEWAY API CRDs ITSELF (`crds.enabled`, default true), so
# there is no separate CRD chart and no earlier wave. The database operator's
# CRDs once came from a separate chart at wave -12. Since D7.3 `platform`
# renders them in the operator's own release, and no Application uses -12.
#
# Envoy Gateway 1.9 requires Gateway API v1.6.1 EXACTLY, per its own
# compatibility matrix, and supports Kubernetes v1.33 through v1.36 — this cluster
# runs v1.36.1, at the top of that range. Both verified 2026-08-30 against the
# project's matrix and a live `helm show chart`, per O10.
# Since D4 Argo fetches the chart inside `platform` from ghcr.io/yadgarhq/charts,
# not from docker.io/envoyproxy. The images still come from Docker Hub:
# docker.io/envoyproxy/gateway:v1.9.1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    # With the operators, and before the Gateway resource at -5: a Gateway
    # applied ahead of the CRD this chart installs is a hard sync failure rather
    # than something Argo retries into place.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    # SCHEME-LESS `repoURL` WITH `chart:`, the same form as the chart's own
    # `example/operators-application.yaml`.
    repoURL: ghcr.io/yadgarhq/charts
    chart: platform
    targetRevision: 0.1.36
    helm:
      valuesObject:
        operators:
          envoyGateway:
            create: true
          argoCd:
            create: false
          certManager:
            create: false
          keda:
            create: false
          mariadbOperator:
            create: false
          prometheus:
            create: false
        gateway-helm:
          # Development sizing (D55). The ceiling on this machine is the ~19
          # database instances, not the controllers.
          deployment:
            envoyGateway:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      # The chart does not create its own namespace — its install instructions
      # pass --create-namespace, which has no equivalent here.
      - CreateNamespace=true
      # Gateway API CRDs exceed the annotation size limit that client-side apply
      # uses to store its last-applied state.
      - ServerSideApply=true
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
