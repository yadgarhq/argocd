# ADOPTED FROM yadgarhq/deploy's `infra/tls-app.yaml` at 05b160b,
# WHEN `infra` RETIRED (option A, ADR-0828). Root adopts the live Application
# by name, keeping its uid. What the move changed, and only this: the source is
# this repository's `manifests/tls/` (byte copies of deploy's `infra/tls/`),
# and S0's `syncPolicy`, which also shortens `retry` from 60 attempts to 6 (see
# the comment on that block). Every rendered object is unchanged (render gate,
# 0 differing objects).
#
# The development TLS edge's trust anchor: `ClusterIssuer/yadgar-dev-ca` and the
# preflight that refuses to sync it without its CA Secret. Hand-written
# manifests rather than a chart.
#
# SPLIT AT STEP 7 of `plans/retiring-the-deploy-copies.md`. The gateway's
# Certificate, the Gateway, its GatewayClass and its EnvoyProxy moved to the
# parent chart (`platform.edgeTLS` and `platform.gatewayListener` in
# deploy's `infra/yadgar/values.yaml`, now this repository's
# `applications/yadgar.yaml`). The parent renders neither of the two files
# left, so this Application stays. Phase E of
# `plans/the-one-application-install.md` moved it to `yadgarhq/argocd`.
#
# A LATER WAVE THAN ITS DEPENDENCIES, and this ordering is load-bearing twice
# over. The ClusterIssuer and Certificate are cert-manager CRDs, and the Gateway
# is a Gateway API CRD installed by Envoy Gateway's chart; a custom resource
# applied before its definition exists is a hard sync failure, not something Argo
# retries into place. Both of those land at -10.
#
# EXPECT THIS APPLICATION TO BE UNHEALTHY UNTIL STEP 3 OF "THE DEVELOPMENT TLS
# EDGE" IN yadgarhq/deploy's MIGRATION_NOTES.md HAS RUN. There is a second
# step 3, in "Move the development domain to yadgar.internal"; that one is not
# this one.
# The ClusterIssuer references a secret holding the CA private key, which is
# created by hand from 1Password and is deliberately not in git. Until it exists
# the issuer reports NotReady and the Certificate stays unissued. That is the
# intended behaviour: the alternative is an issuer that quietly mints its own
# untrusted root, which would look healthy while serving a certificate nothing
# trusts.
#
# AND EXPECT IT TO BECOME HEALTHY ON ITS OWN ONCE THAT STEP HAS RUN, which is
# what `retry` below buys and what ledger 75 found missing. See the comment on
# that block: without it the preflight Job's own failure is the thing that keeps
# this Application Degraded after the cause is fixed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    # NOT UNDER `applications/`: root's include glob lets `*` cross `/`, so a
    # file there would be applied by root itself as well as by this
    # Application — two owners.
    repoURL: https://github.com/yadgarhq/argocd
    targetRevision: main
    path: manifests/tls
  destination:
    server: https://kubernetes.default.svc
    namespace: yadgar
  syncPolicy:
    # S0 OF THE HANDOVER (ADR-0828), THE SAME AS THE OPERATOR APPLICATIONS: no
    # `automated.prune`, and the chart example's bounded `retry` below.
    automated:
      selfHeal: true
    syncOptions: [CreateNamespace=true]
    # RETRY IS WHAT MAKES THE PREFLIGHT RECOVERABLE (ledger 75), and it belongs
    # here rather than on the Job because the thing that never happens again is
    # a SYNC OPERATION, not a reconcile.
    #
    # A Job is terminal: once `manifests/tls/ca-preflight.yaml` exhausts its
    # backoffLimit it stays Failed for ever and never re-runs itself. Argo does
    # not re-run it either, and the reason is Argo's own documented rule rather
    # than an inference — "automatic sync will not reattempt a sync if the
    # previous sync attempt against the same commit-SHA and parameters had
    # failed". Creating the Secret is neither a commit nor a parameter, so
    # fixing the cause changes nothing Argo looks at. `selfHeal` does not rescue
    # it either: selfHeal acts on DRIFT, and a Failed Job's spec still matches
    # git exactly, so there is nothing for it to act on. Observed on this
    # cluster: an operator created the missing Secret, the cause was gone, and
    # `Application/tls` stayed Degraded until `kubectl delete job` was run by
    # hand — precisely the undocumented step the preflight exists to delete.
    #
    # `retry` manufactures the missing sync operation. Each attempt re-syncs
    # every wave, and the Job carries `Replace=true,Force=true`, so each attempt
    # deletes and recreates it — a fresh read of the API server rather than a
    # stale verdict. The moment the Secret is there the Job succeeds, wave -1
    # opens, and the rest of the Application applies.
    #
    # NOTHING CHANGES ON A HEALTHY CLUSTER: retry fires only after a sync
    # operation FAILS, so there is no loop and no extra pod while the Secret is
    # present. That is the property `ttlSecondsAfterFinished` on the Job cannot
    # have — a TTL deletes a SUCCESSFUL Job too, and Argo then recreates it, so
    # a working cluster would churn a pod for ever at whatever period the TTL
    # set, and the same number would bound how long a failure message survives.
    #
    # BOUNDED, NOT UNLIMITED, and the bound is the point rather than a rounding.
    # A retrying operation pins the revision it started on, and Argo starts no
    # second operation while one is in flight — so `limit: -1` would leave a
    # broken `tls` unable to pick up the very commit that fixes it.
    #
    # 6 ATTEMPTS, NOT deploy's 60, BY S0 (ADR-0828). deploy sized 60 attempts
    # at 30s doubling to 5m — hours — for somebody fetching a root CA out of
    # 1Password (ledger 75). S0's 15s doubling to 5m over 6 attempts is about
    # 13 minutes. On a cold cluster without `yadgar-dev-ca` this Application
    # therefore stays Degraded after that window, until the next commit syncs
    # it or `kubectl delete job yadgar-tls-preflight -n cert-manager` re-runs
    # the preflight. The preflight Job's own message still says "60 attempts"
    # and names deploy's files: it is a byte copy, and changing its text
    # changes the Job's pod template, which forces a tls sync that recreates the
    # Job. A later, separate change fixes that text.
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
