# ADOPTED FROM yadgarhq/deploy AT E3 OF THE OPERATORS HANDOVER (ADR-0824), and
# SOURCED FROM yadgarhq's `platform` CHART SINCE D4. Root adopts the live
# Application by name, keeping its uid.
#
# WHAT D4 CHANGED, AND ONLY THIS: `source`. It was KEDA's own chart, `keda`
# 2.20.2 from kedacore. It is now `platform` at the version
# `yadgarhq/chart@v0.3.15` embeds, with `operators.keda.create` true and every
# other operator explicitly false. `platform` 0.1.21 carries the same `keda`
# 2.20.2 as a subchart, so the image tags and the chart label do not move.
#
# WHAT D4 KEPT, so that the handover adopts in place: the Application name, the
# destination namespace `keda`, `syncPolicy`, and no `releaseName`. Argo uses
# the Application name as the helm release name, so the release stays `keda`,
# `app.kubernetes.io/instance` stays `keda`, and no immutable Deployment
# selector changes. Measured 2026-10-01 with both sources rendered as release
# `keda` in namespace `keda`: the same 29 objects, all byte-identical except the
# six KEDA CRDs. `platform` vendors those six with the same schema and adds two
# annotations, `helm.sh/resource-policy: keep` and
# `argocd.argoproj.io/sync-options: Prune=false`.
#
# EACH OPERATOR KEY IS WRITTEN, NOT LEFT UNSET. `platform` resolves an unset
# `operators.<op>.create` through `operators.create`, so an unset key is a
# second place that decides what this Application installs.
#
# `keda.resources` IS deploy's development sizing (D55), moved under
# `platform`'s `keda:` subchart key. Without it the operator and metrics
# server pod templates fall back to KEDA's defaults, and both Deployments roll.
#
# `syncPolicy` is S0 of the operators handover (ADR-0824): `automated.prune` is
# omitted, and `retry` is copied from `yadgarhq/chart@v0.3.15`'s
# `example/operators-application.yaml`. No `Prune=false` here: root's apply
# removes the one E1 left on the live object.
#
# WHAT IS GATED, AND WHAT IS ONLY MEASURED.
# scripts/tests/test_operator_applications.py pins this Application's shape:
# the source, the platform version, every operator key, the sizing, the
# absent `releaseName`, and every field outside `source`. It does not render
# anything. The 29-object render equivalence, the CRD schema equality, and
# `platform` 0.1.21 embedding `keda` 2.20.2 are a 2026-10-01 measurement,
# recorded in yadgarhq/argocd#44, and no check re-runs them.
#
# KEDA — the autoscaling mechanism D68 chose, installed as cluster infrastructure
# in its own namespace like the database operator.
#
# WHY KEDA RATHER THAN A PLAIN HPA. D68's signals are not CPU: a `-db` waits on
# MariaDB and `ask` waits on an LLM provider, so both saturate at low CPU and a
# CPU-driven HPA stays quiet precisely when the system is in trouble. The
# write-path consumers scale on JetStream consumer lag, which no resource metric
# approximates at all. KEDA covers queue depth natively, wraps a plain HPA for the
# concurrency cases, and gives scale-to-zero for a module whose plugin is switched
# off (D1) — one mechanism instead of prometheus-adapter plus special cases.
#
# ONE WAVE, NOT TWO, and since D7.3 mariadb-operator is the same. Its own chart
# shipped its CRDs SEPARATELY, and landing them at the same wave as the
# controller made it crash-loop with an error naming an indexer rather than a
# missing CRD — which is why wave -12 existed. No Application uses -12 any more:
# `platform` vendors mariadb-operator's 12 CRDs into that operator's own
# release. KEDA's six CRDs render in the SAME release as its controller too:
# `platform` vendors them as its own templates (and sets `keda.crds.install`
# false), so this Application needs no separate wave.
#
# Licence and supply chain verified before adoption, per O10: Apache-2.0 from the
# repository's own LICENSE, CNCF graduated, maintainers across four employers,
# images pulling anonymously from ghcr.io by exact tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    # SCHEME-LESS `repoURL` WITH `chart:`, the same form as the chart's own
    # `example/operators-application.yaml`.
    repoURL: ghcr.io/yadgarhq/charts
    chart: platform
    targetRevision: 0.1.36
    helm:
      valuesObject:
        operators:
          keda:
            create: true
          argoCd:
            create: false
          certManager:
            create: false
          envoyGateway:
            create: false
          mariadbOperator:
            create: false
          prometheus:
            create: false
        keda:
          # Development sizing (D55). The ceiling on this machine is the ~19
          # database instances, not the controllers.
          resources:
            operator:
              requests:
                cpu: 50m
                memory: 128Mi
            metricServer:
              requests:
                cpu: 50m
                memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are large enough to exceed the last-applied-configuration
      # annotation limit, which is a kubectl apply failure rather than a KEDA one.
      - ServerSideApply=true
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
