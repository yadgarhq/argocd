# The read-only identity of the post-merge verifier (`scripts/verify_handover.py`).
# `root` selects this file; this Application syncs `verifier/manifests/`: a
# Namespace, a ServiceAccount, and a get/list/watch ClusterRole with no Secrets,
# bound to that ServiceAccount.
#
# NO RUNNER AND NO WORKFLOW HERE, DELIBERATELY. This repository is public, so a
# runner registered against it would take jobs from any workflow a collaborator
# pushes. The runner registers against a PRIVATE repository that runs only the
# verifier; MIGRATION_NOTES.md, "The post-merge verifier", holds its exact
# files and the order a person creates them in. Its scale set is
# applications/post-merge-verifier-runner.yaml (ledger 1219).
#
# `verifier/` sits outside root's `applications/*.yaml` include, so root
# applies this Application and only this Application applies
# the RBAC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: post-merge-verifier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yadgarhq/argocd
    targetRevision: main
    path: verifier/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: post-merge-verifier
  # The operators' shape (S0, ADR-0824): self-heal, no `prune` key, and the
  # chart example's finite retry.
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
