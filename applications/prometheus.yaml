# ADOPTED FROM yadgarhq/deploy AT E3 OF THE OPERATORS HANDOVER (ADR-0824), and
# SOURCED FROM yadgarhq's `platform` CHART SINCE D4. Root adopts the live
# Application by name, keeping its uid.
#
# WHAT D4 CHANGED, AND ONLY THIS: `source`. It was the community chart,
# `prometheus` 29.27.0 from prometheus-community.github.io. It is now `platform`
# at the version `yadgarhq/chart@v0.3.15` embeds, with
# `operators.prometheus.create` true and every other operator explicitly false.
# `platform` 0.1.21 carries the same `prometheus` 29.27.0 as a subchart, so the
# image tags and the chart label do not move.
#
# WHAT D4 KEPT, so that the handover adopts in place: the Application name, the
# destination namespace `observability`, `syncPolicy` (CreateNamespace only, no
# ServerSideApply, as deploy declared it), and no `releaseName`. Argo uses the
# Application name as the helm release name, so the release stays `prometheus`,
# `app.kubernetes.io/instance` stays `prometheus`, and no immutable Deployment
# selector changes.
#
# THE ONE REAL CHANGE IS THE SCRAPE INTERVAL, 1m TO 15s, and it is approved.
# `platform` sets `server.global.scrape_interval: 15s` because the module
# ScaledObjects query `rate(...[2m])`, and at 1m a 2m window holds too few
# samples for `rate`. Measured 2026-10-01 with both sources rendered as release
# `prometheus` in namespace `observability`: the same 7 objects, and the only
# difference is `global.scrape_interval` in ConfigMap `prometheus-server`'s
# `prometheus.yml`. `evaluation_interval` stays 1m. The Deployment's selector
# and pod template are equal, so nothing rolls; the configmap-reload sidecar
# reloads the server when the mounted file changes.
#
# THIS SWAP IS NOT 0-DIFF. The ConfigMap differs, so the Application goes
# OutOfSync and automated sync patches it. Neither chart renders a helm hook, so
# the sync runs no PreSync or PostSync step.
#
# MEASURED LIVE, read-only, 2026-10-01, and the values below keep each of these:
# PVC `prometheus-server` (2Gi, Bound, ReadWriteOnce, storage class `standard`
# on the rancher.io/local-path provisioner, node-pinned to yadgar-worker), the
# four yadgar alerting rules, Deployment strategy Recreate, and no resources on
# the configmap-reload container. All came from deploy's values. The PVC renders under the same name from both charts, with an equal
# spec and no `helm.sh/resource-policy`; Argo patches an existing object and
# never replaces it without `Replace=true`, so the claim and its TSDB stay.
#
# EACH OPERATOR KEY IS WRITTEN, NOT LEFT UNSET. `platform` resolves an unset
# `operators.<op>.create` through `operators.create`, so an unset key is a
# second place that decides what this Application installs.
#
# WHAT THE `prometheus:` VALUES CARRY, AND WHY EACH ONE:
# - `server.persistentVolume`. `platform` defaults it to `enabled: false`,
#   which renders an emptyDir and drops the PVC: an empty TSDB on the next pod.
# - `configmapReload.prometheus.resources: null`. `platform` adds 10m/32Mi
#   requests to the reload sidecar, which changes the pod template, and the pod
#   rolls. `null` deletes the key in helm's merge; an empty map `{}` does not
#   (measured: `{}` still renders 10m/32Mi). That `null` is why these values
#   are the `helm.values` STRING and not `valuesObject`, unlike the other three:
#   a `null` inside `valuesObject` can be dropped on root's apply.
# - `serverFiles."alerting_rules.yml"`. deploy's rules, verbatim. `platform`
#   carries none.
# deploy's server sizing (100m/256Mi), `retention: 24h` and the four disabled
# components are `platform`'s own defaults, so they are not repeated here.
#
# `syncPolicy` is S0 of the operators handover (ADR-0824): `automated.prune` is
# omitted, and `retry` is copied from `yadgarhq/chart@v0.3.15`'s
# `example/operators-application.yaml`. No `Prune=false` here: root's apply
# removes the one E1 left on the live object.
#
# WHAT IS GATED, AND WHAT IS ONLY MEASURED.
# scripts/tests/test_operator_applications.py pins this Application's shape:
# the source, the platform version, every operator key, the PVC and reloader
# values, a digest of the alerting rules, the `helm.values` form, the absent
# `releaseName`, and every field outside `source`. It does not render anything.
# The 7-object render equivalence, the one scrape-interval difference, the
# equal PVC, the absent hooks, and the live facts above are a 2026-10-01
# measurement, recorded in the pull request that made this change, and no
# check re-runs them.
#
# Prometheus, and it is here for ONE reason: D68's autoscaler needs somewhere to
# read D67's metrics from. KEDA's prometheus scaler queries a server; the services
# expose /metrics and nothing was scraping them.
#
# SERVER ONLY. No alertmanager, no pushgateway, no node-exporter, no kube-state.
# A development cluster does not need paging, and every extra component is one
# more thing to keep healthy for no current purpose. They can be enabled the day
# something wants them (D55: the environment is prod-like in the ways that expose
# defects, not in every way).
#
# Licence and supply chain verified before adoption, per O10: Apache-2.0 from the
# repository's own LICENSE, CNCF graduated, image pullable by exact tag from
# quay.io.
# Since D4 Argo fetches the chart inside `platform` from ghcr.io/yadgarhq/charts,
# not from prometheus-community.github.io. The image still comes from quay.io.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # Before the modules, which is what it scrapes — but after the operators, so
    # it is not competing for the first wave.
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    # SCHEME-LESS `repoURL` WITH `chart:`, the same form as the chart's own
    # `example/operators-application.yaml`.
    repoURL: ghcr.io/yadgarhq/charts
    chart: platform
    targetRevision: 0.1.21
    helm:
      values: |
        operators:
          prometheus:
            create: true
          argoCd:
            create: false
          certManager:
            create: false
          envoyGateway:
            create: false
          keda:
            create: false
          mariadbOperator:
            create: false
        prometheus:
          server:
            # deploy's PVC. `platform` defaults `enabled` to false.
            persistentVolume:
              enabled: true
              size: 2Gi
          # `null`, not `{}`: it deletes `platform`'s 10m/32Mi requests, so the
          # pod template stays as deploy rendered it and nothing rolls.
          configmapReload:
            prometheus:
              resources: null
          # NO custom scrape_configs, deliberately. The chart already ships a
          # `kubernetes-pods` job doing annotation-based discovery, and adding one
          # of my own scraped every pod TWICE — two targets, two series per pod.
          #
          # The per-replica query survived that by accident (numerator and
          # denominator both doubled), which is the worst kind of correct: any
          # query that does not divide — a raw rate on a dashboard — would have
          # read 2x and nothing would have said so.
          #
          # Found by checking the target list rather than trusting `up == 1`.
          #
          # ALERTING RULES — the first consumer any yadgar metric has ever had.
          #
          # WHY HERE AND NOT IN A MODULE CHART. A `PrometheusRule` is not
          # reconcilable in this estate at all: there is no Prometheus Operator,
          # no `monitoring.coreos.com` CRD and no `ServiceMonitor` anywhere
          # (verified 2026-09-05 against the cluster's own CRD list, and against
          # `deploy` by grep). A module chart emitting that CRD would also be a
          # chart an adopter cannot install without a CRD they did not choose,
          # which D80 forbids in as many words. So the rules live on the
          # reference deployment's own Prometheus, where being opinionated is
          # the point rather than a leak.
          #
          # STILL NO ALERTMANAGER, and that is a decision rather than an
          # omission. Nothing in `deploy` or `argocd` holds an SMTP relay, a
          # Slack webhook, a PagerDuty routing key or any other receiver —
          # checked, not assumed. Enabling it would add a Deployment, a PVC and
          # an Argo health check in order to route every alert to the chart's
          # default null receiver: a component whose green means nothing, and
          # which makes the estate LOOK like it pages. That is the exact
          # confusion this change exists to remove, so it is refused. The
          # sentence above still holds — they can be enabled the day something
          # wants them.
          #
          # WHAT A RULE WITH NO RECEIVER BUYS, since it is less than a page and
          # more than nothing. The predicate stops being prose in a library's doc
          # comment and becomes a reviewed, diffable, `promtool`-checkable
          # expression that this repository owns. Prometheus evaluates alerting
          # rules whether or not any alertmanager is configured, so `ALERTS` and
          # `ALERTS_FOR_STATE` become queryable series and `/alerts` shows the
          # state. A metric is a capability and not yet a signal; a rule with no
          # receiver is a reviewed predicate and not yet a page. Each is one
          # honest step, and neither should be described as the next one.
          #
          # ABSENCE IS NEVER READ AS ZERO. Every rule below is a comparison on a
          # series that must EXIST to match, so a metric no pod publishes fires
          # nothing. There are deliberately NO `absent()` companions, and the
          # reason has MOVED since this was first written. It used to be that
          # only one `yadgar_*` name existed, so any `absent()` would fire at
          # once and be silenced within a day. Measured on 2026-09-05 WHILE THE
          # ESTATE WAS DEPLOYED, the store held THREE —
          # `yadgar_dial_upstream_never_resolved`,
          # `yadgar_rotation_watched_files_unreadable` and
          # `yadgar_tls_certificate_not_after_seconds`, one per rule below — so
          # an `absent()` on any of those names would fire never, which is just
          # as useless. That cluster has since been recreated bare and carries no
          # workloads, so nothing is scraped TODAY; the argument rests on which
          # names exist whenever the estate runs, not on what the store holds at
          # this moment. Every real gap this file has ever had was a missing
          # LABEL VALUE inside a name that is present, rather than a missing name
          # — the two worked examples were `upstream="iam"` and
          # `service="iam-db"`, and BOTH have since closed (`gateway`#34,
          # `iam-db`#22, `task-db`#37), which is itself the point: a gap of this
          # shape opens and closes in another repository without this file
          # changing.
          # `absent()` cannot see that unless the rule NAMES the value it
          # expects, and nothing has declared which series must exist. The limit
          # that buys is stated rather than hidden — a `> 0` rule cannot notice
          # its own reporter going away, and no rule here can, until a series'
          # presence is itself a deployment invariant somebody declared.
          serverFiles:
            alerting_rules.yml:
              groups:
                - name: yadgar
                  rules:
                    # ADR-0532's lazy dial traded operator legibility for client
                    # legibility. A service whose upstream is absent used to show
                    # as CrashLoopBackOff with climbing restarts and a Degraded
                    # Argo Application; it now shows 1/1 Running and Argo
                    # Healthy, with nothing anywhere saying it is broken. The
                    # replacement offered was an ERROR log line per refresh tick,
                    # and this namespace runs a Prometheus server and NO log
                    # shipper — no promtail, loki, fluent-bit or vector — so that
                    # line reaches `kubectl logs` and an operator who has already
                    # guessed the answer. This is the rule the gauge was shaped
                    # for, and it is the reason the gauge exists.
                    #
                    # WIRED FOR ALL FOUR HOPS, AND NOT RE-MEASURED SINCE.
                    # `gateway`, `iam` and
                    # `task` pin `yadgar-dial` at v0.2.1, which is the tag the
                    # gauge arrived in. A prior revision of this comment measured
                    # this store on 2026-09-05 and found only three `upstream`
                    # values — `task` from `gateway`, `iam-db` from `iam`,
                    # `task-db` from `task` — because `gateway::upstream::
                    # connect_iam` built its own `Endpoint` and bypassed `dial`
                    # entirely, so the hop carrying every login, enrolment and
                    # attestation published nothing.
                    #
                    # `gateway`#34 ("Route the iam hop through yadgar-dial, so
                    # the alert can see it") closed that gap: `connect_iam` now
                    # calls `yadgar_dial::connect`/`connect_tls` exactly as
                    # `connect_task` does, and the module's own doc comment
                    # states plainly that routing both hops through `dial` is
                    # what publishes the absence gauge for each. Read on
                    # `gateway` main this is the current shape — confirmed from
                    # source, NOT from a fresh scrape, because this reference
                    # deployment's kind cluster carries no workloads to scrape.
                    #
                    # SO THIS RULE'S EXPRESSION HAS NO LABEL MATCHER AND NEEDS
                    # NONE: `max_over_time(yadgar_dial_upstream_never_resolved
                    # [5m]) > 0` fires on whatever `upstream` values exist,
                    # and now that `connect_iam` publishes one, `gateway` -> `iam`
                    # is covered the same way the other three hops are. Before
                    # trusting that live, scrape a `gateway` pod's own `/metrics`
                    # for `upstream="iam"` the way the three-hop count above was
                    # originally confirmed — this revision has not re-run that
                    # scrape.
                    #
                    # NO `by (upstream)` AGGREGATION, on purpose. An alerting
                    # rule has no `by` clause; the expression's OUTPUT LABELS are
                    # what fires and what an annotation can name. This form keeps
                    # `upstream` and `pod` and `namespace`, so one alert names
                    # both the absent upstream and which replica cannot reach it.
                    # `max by (upstream) (...)` reads closer to the English and
                    # throws the pod away.
                    - alert: DialUpstreamNeverResolved
                      expr: max_over_time(yadgar_dial_upstream_never_resolved[5m]) > 0
                      for: 2m
                      labels:
                        severity: critical
                      annotations:
                        summary: >-
                          {{ $labels.pod }} has never resolved its upstream
                          {{ $labels.upstream }}
                        description: >-
                          The process is running and reports Ready, and no
                          address for {{ $labels.upstream }} has EVER been given
                          to its balancer since boot — so every call through that
                          seam fails. This is not a transient blip: the value
                          is a LATCH rather than a sample, so a 1 says no address
                          has arrived since boot, not that one lookup just
                          failed. Check that the upstream's Service and pods
                          exist in {{ $labels.namespace }}.
                    # A file the deployment NAMED and the process could not read.
                    # Rotation of that file cannot be noticed, so the pod will
                    # keep serving material it can no longer see change.
                    #
                    # `for: 10m` IS SIZED AGAINST THE POLL, not picked. The
                    # charts set `tlsRotation.pollSeconds: 60` and the library's
                    # own default is 60s, and the code is explicit that a file
                    # unreadable at this instant is the transient state kubelet
                    # passes through while it rewrites a mount. Roughly ten polls
                    # have to agree before this fires; one mount rewrite cannot.
                    #
                    # Absence here means a pod with an EMPTY watch set, one
                    # that has not finished its first poll — the gauge is
                    # published only inside the loop — or a pod with NO WATCHER
                    # AT ALL, which is the cause this used to leave out.
                    # A prior revision of this comment measured this series on
                    # 2026-09-05 and found `service` values `gateway`, `iam` and
                    # `task` only, because `iam-db` and `task-db` built
                    # `yadgar-lifecycle` with `default-features = false`, which
                    # compiled the whole `rotate` module out — the module that
                    # owns this gauge AND the expiry gauge the rule below wants.
                    #
                    # BOTH REPOSITORIES TOOK THE WATCHER BACK since then —
                    # `iam-db`#22 and `task-db`#37, "take the rotation watcher
                    # back" — and neither manifest carries `default-features =
                    # false` on `yadgar-lifecycle` any more; both now wire
                    # `rotate::watch` into their own `main.rs` the same way
                    # `iam` and `task` do. Confirmed from source on each
                    # repository's main, not from a fresh scrape: this reference
                    # deployment's kind cluster carries no workloads, so the
                    # `service` values above have not been re-measured live.
                    # Absence does not mean zero, and `> 0` is the shape that
                    # respects the difference.
                    - alert: RotationWatchedFilesUnreadable
                      expr: yadgar_rotation_watched_files_unreadable > 0
                      for: 10m
                      labels:
                        severity: warning
                      annotations:
                        summary: >-
                          {{ $labels.service }} cannot read
                          {{ $value }} of its watched files
                        description: >-
                          A path this deployment told {{ $labels.service }} to
                          watch has been unreadable for ten consecutive polls, so
                          it is a configuration defect rather than a mount being
                          rewritten. Rotation of those files cannot be noticed
                          while this holds, and the pod goes on presenting
                          whatever it loaded at boot. The pod is
                          {{ $labels.pod }}; the log line at boot names the paths.
                    # NOT THE ONLY RULE HERE THAT CAN FIRE TODAY ANY MORE — see
                    # below. `yadgar_tls_certificate_not_after_seconds` is a
                    # `yadgar_*` series this Prometheus holds; `iam` and `task`
                    # publish it at `kind="serving"`, and `iam-db` and `task-db`
                    # now do too (see below).
                    #
                    # FOURTEEN DAYS, ARITHMETIC RATHER THAN TASTE. All eight
                    # LEAF certificates this repository declares — four serving
                    # and three client under `infra/internal-tls/`, plus the edge
                    # leaf in `infra/tls/` — set `duration: 2160h` (90d). Their
                    # `renewBefore` values are NO LONGER ALL 720h: the seven
                    # under `infra/internal-tls/` climb a 6-hour ladder from 726h
                    # to 762h so that no two services renew in the same window,
                    # which is argued at length in `certificates.yaml`. The edge
                    # leaf keeps 720h.
                    #
                    # THE THRESHOLD IS SIZED AGAINST THE SMALLEST OF THEM, and
                    # the ladder only ever moves a renewal EARLIER, so the floor
                    # is the edge leaf's 720h: cert-manager rewrites every Secret
                    # here with AT LEAST 30 days left. Firing at 14 therefore
                    # still means sixteen days of renewal-or-reload having failed
                    # before anyone is told, and fourteen days of runway after.
                    # It is a BACKSTOP behind cert-manager rather than the first
                    # line, and it sits far enough below every `renewBefore` here
                    # that a normal renewal cannot trip it.
                    #
                    # THIS RULE NOW COVERS FOUR CERTIFICATES OF NINE, and naming
                    # the other five is the honest half of drawing this
                    # boundary. A prior revision of this comment measured this
                    # store on 2026-09-05 against `service="iam"` and
                    # `service="task"` only and named `iam-db-tls` and
                    # `task-db-tls` as PRESENTED-but-uncounted: both pods serve
                    # TLS and both are scraped, but `iam-db` and `task-db` took
                    # `yadgar-lifecycle` with `default-features = false`, which
                    # gated the whole `rotate` module — the module that owns
                    # this gauge — off.
                    #
                    # `iam-db`#22 and `task-db`#37, "take the rotation watcher
                    # back", removed that flag in both manifests and wired
                    # `rotate::watch` into each `main.rs`. Confirmed from
                    # source on each repository's main: `yadgar-lifecycle` is no
                    # longer pinned `default-features = false` in either
                    # `Cargo.toml`, and both watch their own `LISTEN_TLS_*`
                    # material the same way `iam` and `task` do. So
                    # `yadgar_tls_certificate_not_after_seconds` should now
                    # additionally carry `service="iam-db"` and
                    # `service="task-db"` at `kind="serving"` — NOT re-measured
                    # live, because this reference deployment's kind cluster
                    # carries no workloads to scrape.
                    #
                    # NOTHING PRESENTS THE REMAINING FIVE, so they can never
                    # appear here at all. The internal root is `duration:
                    # 87600h` with `renewBefore: 8760h`
                    # (`infra/internal-tls/issuer.yaml`), the one certificate on
                    # a different clock. `gateway-tls` is served by the edge
                    # Gateway's listener rather than by any yadgar process.
                    # `gateway-client-tls`, `iam-client-tls` and
                    # `task-client-tls` are issued and mounted into no pod —
                    # checked against the live manifests in `argocd`, not
                    # inferred.
                    #
                    # SO A QUIET RULE HERE MEANS `iam`, `task`, `iam-db` AND
                    # `task-db` ARE FINE. It says nothing about the other five.
                    # It is still worth landing, for the reason below.
                    #
                    # It measures what the PROCESS loaded, which is the gap
                    # cert-manager's own metrics cannot see: cert-manager knows
                    # what it issued, this knows what is being presented. The
                    # value is exported once at boot and that is correct by
                    # construction — a material change makes the rotation watcher
                    # drain and exit 0, so the process restarts onto the new
                    # certificate and re-exports.
                    #
                    # An already-expired certificate satisfies this too, since
                    # the difference goes negative. That is the worse state and
                    # the same action, so it is not split into a second rule.
                    #
                    # NO `for:` HERE, and it is the one rule in this group
                    # without one. The other two watch a value that moves, so a
                    # pending window is what separates a condition from a blip.
                    # This value is exported ONCE, at boot, and then never
                    # changes for the life of the process — there is nothing to
                    # flap, so a single scrape is already the whole signal. A
                    # pending window would only delay the alert past a restart,
                    # and worse, a pod restarting more often than that window
                    # would reset the timer every time and never fire. A rule a
                    # restart loop can silence is the failure this whole file
                    # exists to correct.
                    - alert: TlsCertificateExpiringSoon
                      expr: yadgar_tls_certificate_not_after_seconds - time() < 14 * 24 * 3600
                      labels:
                        severity: warning
                      annotations:
                        summary: >-
                          {{ $labels.service }}'s {{ $labels.kind }} certificate
                          expires in under 14 days
                        description: >-
                          The certificate {{ $labels.pod }} actually loaded
                          expires at {{ $value }} seconds from now. cert-manager
                          renews these at 30 days remaining, so reaching 14 means
                          either the renewal or the pod's reload has been failing
                          for about a fortnight. Check the Certificate resource
                          and whether the pod restarted after the Secret was
                          rewritten.
                    # THE ONLY SECURITY RULE IN THIS FILE, and the only one whose
                    # subject is an act rather than a condition. ADR-0492 leaves
                    # the admin bootstrap token live, and accepts that risk on the
                    # reasoning that a leak "is loud and lands in the audit
                    # trail". THERE IS NO AUDIT TRAIL. The audit store is a
                    # deferred future module, and this namespace runs a Prometheus
                    # server and NO log shipper — the same fact the dial rule at
                    # the top of this group rests on. So `gateway`'s
                    # `tracing::warn!` at the `Bootstrap::Accepted` arm, added in
                    # `gateway`#59, was the ONLY record that a stranger became an
                    # administrator, and it lived in a pod's stdout and died with
                    # the pod. The record did not survive the event it recorded.
                    #
                    # `gateway`#60 converted it, exactly as the invalidation
                    # signal was converted before it: a log line nobody reads
                    # became `yadgar_gateway_bootstrap_accepted_total`, and this is
                    # the rule that reads it. That conversion buys DETECTION and
                    # NOT ATTRIBUTION, and the annotation below says so rather than
                    # implying an attribution this estate cannot make.
                    #
                    # THE PREDICATE IS SHAPED BY THE COUNTER BEING ABSENT UNTIL
                    # THE FIRST ACCEPTANCE, which is the one thing to understand
                    # about this rule. `metrics::counter!` registers a name with
                    # the recorder only when the macro EXECUTES, so a gateway that
                    # has never accepted a bootstrap token publishes no such series
                    # at all — absent, rather than present at 0. `gateway` argues
                    # at the emit site why that is correct for a security counter
                    # (a counter of events has no meaningful zero, and publishing
                    # one from every replica would stop existence being the
                    # signal). It leaves this rule three shapes, two of which are
                    # wrong:
                    #
                    #   - `absent(...)` is wrong for the reason this file already
                    #     argues at length above: a name that never appears fires
                    #     never.
                    #   - `increase(...) > 0` is wrong, and is the shape somebody
                    #     will propose. Prometheus takes the first sample in the
                    #     range as the BASELINE, so a counter going absent -> 1
                    #     yields an increase of ~0. Such a rule catches the SECOND
                    #     acceptance and misses the FIRST — exactly backwards for
                    #     an event whose first occurrence is the one that matters.
                    #   - `max_over_time(...) > 0` is right, and it is the same
                    #     shape `DialUpstreamNeverResolved` uses. It is a
                    #     comparison on a series that must EXIST to match, so it
                    #     honours this file's absence-is-never-zero rule, and here
                    #     existence and the event are the same fact: the series
                    #     cannot be present below 1.
                    #
                    # THE RANGE IS 24h BECAUSE THE STORE'S RETENTION IS, and this
                    # is the honest limit of what was bought. `retention: 24h` is
                    # set at the top of this file, so a bare `> 0` would stop
                    # matching roughly five minutes after the emitting pod died —
                    # reproducing the very failure this rule exists to correct, a
                    # record that does not outlive the pod. `max_over_time` over
                    # the whole retention window keeps the alert firing for as long
                    # as this store can remember anything at all. AFTER 24 HOURS IT
                    # GOES QUIET, and the clock is the thing to get right here.
                    # IT RUNS FROM THE LAST SCRAPE OF THE EMITTING SERIES, NOT
                    # FROM THE ACCEPTANCE — so the 24h figure describes only the
                    # case where the pod that served the request is GONE. A
                    # SURVIVING pod is the dominant case and behaves the opposite
                    # way: it keeps being scraped at 1, the range never empties,
                    # and this rule fires continuously for as long as that pod
                    # lives. Both halves measured with `promtool test rules`
                    # rather than read off the documentation — a pod alive
                    # throughout fires at 25m and STILL FIRES at 28h; a pod that
                    # dies at 15m fires at 25m and is silent by 25h.
                    #
                    # SO THERE ARE TWO HONEST SENTENCES AND NOT ONE, and the
                    # annotation carries both. Where the pod survives, this alert
                    # DOES NOT CLEAR, and there is no way to acknowledge or
                    # silence it in this estate: `alertmanager.enabled` is `false`
                    # at the top of this file, and a silence is an Alertmanager
                    # object. Where the pod is gone, the record expires a day
                    # after its last scrape whether or not anybody looked, and
                    # quiet then does not mean nothing happened. This converts
                    # "dies with the pod" into "outlives the pod, by a day at
                    # worst and indefinitely while it lives". It does not close
                    # ADR-0492's §7.3.4 gap, and nothing short of the audit module
                    # will.
                    #
                    # NO `for:`, for `TlsCertificateExpiringSoon`'s reason and one
                    # of its own. The value never decreases within a pod's life, so
                    # there is nothing to flap and a pending window could only
                    # delay the page; and a restart loop that reset the timer every
                    # time would silence it, which is the failure this file exists
                    # to correct. On a security event the delay is the whole cost.
                    #
                    # `critical`, AND IT STAYS CRITICAL NOW THAT THE NON-CLEARING
                    # BEHAVIOUR IS UNDERSTOOD. The objection to weigh is real: an
                    # alert that cannot be acknowledged and does not clear is the
                    # classic way a `critical` becomes wallpaper. It is answered
                    # by this file's own precedent rather than by taste.
                    # `DialUpstreamNeverResolved` is `critical` and is a LATCH in
                    # exactly the same way — its gauge "is a LATCH rather than a
                    # sample", so it too never clears while the pod lives — so
                    # this rule introduces no property the group does not already
                    # carry at this severity. Severity states HOW BAD THE EVENT
                    # IS, and an unattributable administrator now exists in this
                    # deployment; downgrading on the ground that the estate has no
                    # silence path would encode an operational gap as a security
                    # judgement, and would be the wrong label on the day an
                    # Alertmanager is enabled. The condition is cleared by acting
                    # on it — rotate the Secret, and the pod that served the
                    # request stops being the current one.
                    - alert: BootstrapTokenAccepted
                      expr: max_over_time(yadgar_gateway_bootstrap_accepted_total[24h]) > 0
                      labels:
                        severity: critical
                      annotations:
                        # NO `{{ $value }}` HERE, AND IT IS NOT AN OMISSION. The
                        # other three rules print theirs because each is a reading
                        # an operator can act on — a file count, seconds to expiry.
                        # This expression's value is a COUNTER'S CUMULATIVE TOTAL
                        # SINCE THAT POD BOOTED, which is not the number a reader
                        # of this sentence would take it for: it is not a count for
                        # the window, and a restart starts a fresh series, so it
                        # can DROP while the alert still fires from the older one.
                        # A number that invites a wrong conclusion is worse than no
                        # number in an annotation whose whole purpose is to say
                        # exactly how little is known. The real count lives where
                        # the description sends the operator.
                        summary: >-
                          the admin bootstrap token was ACCEPTED in
                          {{ $labels.namespace }}
                        description: >-
                          Somebody presented this deployment's admin bootstrap
                          token to gateway and it was accepted, so an
                          administrator was CREATED or an existing account was
                          PROMOTED to one. This says THAT it happened and cannot
                          say WHO did it: the bootstrap path carries no actor by
                          construction (D73), so no identity exists to record.
                          There is no audit trail in this estate — this alert
                          and an ephemeral pod log are the entire record. THIS
                          ALERT WILL NOT CLEAR BY ITSELF while the pod that
                          served the request is still running and being scraped,
                          and nothing here can acknowledge or silence it, because
                          this deployment runs no Alertmanager. If that pod is
                          already gone the record instead expires 24 hours after
                          its LAST SCRAPE — not 24 hours after the acceptance —
                          whether or not anyone investigated, so silence later is
                          not evidence that nothing happened. The pod named here,
                          {{ $labels.pod }}, MAY ALREADY BE GONE: the alert
                          deliberately outlives it, and a restarted gateway
                          reports a new series. Enumerate the administrators iam
                          holds and confirm every one of them was expected, then
                          rotate the admin-bootstrap-token Secret.
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
