# ADOPTED FROM yadgarhq/deploy AT E3 OF THE OPERATORS HANDOVER (ADR-0824), and
# SOURCED FROM yadgarhq's `platform` CHART SINCE D4. Root adopts the live
# Application by name, keeping its uid.
#
# WHAT D4 CHANGED, AND ONLY THIS: `source`. It was jetstack's own chart,
# `cert-manager` v1.21.1 from charts.jetstack.io. It is now `platform` at the
# version `yadgarhq/chart@v0.3.15` embeds, with `operators.certManager.create`
# true and every other operator explicitly false. `platform` 0.1.21 carries the
# same `cert-manager` v1.21.1 as a subchart (its Chart.yaml and Chart.lock), so
# the image tags and the chart label do not move.
#
# WHAT D4 KEPT, so that the handover adopts in place: the Application name, the
# destination namespace `cert-manager`, `syncPolicy`, and no `releaseName`. Argo
# uses the Application name as the helm release name, so the release stays
# `cert-manager`, `app.kubernetes.io/instance` stays `cert-manager`, and no
# immutable Deployment selector changes. Measured 2026-10-01 with both sources
# rendered as release `cert-manager` in namespace `cert-manager`: the same 50
# objects with no content difference, the three Deployments' selectors and pod
# templates included, and the six CRDs with equal `spec` and the same
# `helm.sh/resource-policy: keep` annotation.
#
# EACH OPERATOR KEY IS WRITTEN, NOT LEFT UNSET. `platform` resolves an unset
# `operators.<op>.create` through `operators.create`, so an unset key is a
# second place that decides what this Application installs.
#
# THE `cert-manager:` VALUES ARE deploy's, moved under `platform`'s subchart
# key unchanged: `crds.enabled` and `crds.keep`, and the development sizing
# (D55). Without the sizing the controller, webhook and cainjector pod templates
# fall back to cert-manager's defaults, and all three Deployments roll.
#
# `syncPolicy` is S0 of the operators handover (ADR-0824): `automated.prune` is
# omitted, and `retry` is copied from `yadgarhq/chart@v0.3.15`'s
# `example/operators-application.yaml`. No `Prune=false` here: root's apply
# removes the one E1 left on the live object.
#
# WHAT IS GATED, AND WHAT IS ONLY MEASURED.
# scripts/tests/test_operator_applications.py pins this Application's shape:
# the source, the platform version, every operator key, the carried values, the
# absent `releaseName`, and every field outside `source`. It does not render
# anything. The 50-object render equivalence, the CRD schema equality, and
# `platform` 0.1.21 embedding `cert-manager` v1.21.1 are a 2026-10-01
# measurement, recorded in yadgarhq/argocd#45, and no check re-runs them.
#
# cert-manager — here to sign the development TLS certificate the gateway serves,
# and nothing else yet.
#
# WHY IT EXISTS AT ALL rather than one `openssl` certificate in a secret. The
# hand-made version is genuinely less machinery, and it is the right answer for a
# cluster you rebuild weekly. This one is not: it is nix-declarative with a
# systemd unit, so it outlives a 90-day certificate. When that certificate
# expires there is no renewal and no warning — TLS simply starts failing, and the
# quickest apparent fix is to stop verifying. Automatic renewal is the entire
# value here.
#
# It does NOT own the trust anchor. The CA key is minted by hand, kept in
# 1Password and loaded as a secret (MIGRATION_NOTES.md); cert-manager signs with
# it. See infra/tls/clusterissuer.yaml for why the root is external.
#
# Licence and supply chain verified before adoption, per O10: Apache-2.0 from the
# chart's own annotation and the repository LICENSE, CNCF graduated. Chart
# v1.21.1 was verified present in charts.jetstack.io's live index on 2026-08-30,
# and its Chart.yaml declares `kubeVersion: >= 1.22.0-0`, which v1.36.1
# satisfies. Since D4 Argo fetches it inside `platform` from
# ghcr.io/yadgarhq/charts, not from charts.jetstack.io.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # With the operators. The Certificate and ClusterIssuer that use it land at a
    # later wave, because an issuer applied before its CRD exists is a sync error
    # rather than a retry.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    # SCHEME-LESS `repoURL` WITH `chart:`, the same form as the chart's own
    # `example/operators-application.yaml`.
    repoURL: ghcr.io/yadgarhq/charts
    chart: platform
    targetRevision: 0.1.26
    helm:
      valuesObject:
        operators:
          certManager:
            create: true
          argoCd:
            create: false
          envoyGateway:
            create: false
          keda:
            create: false
          mariadbOperator:
            create: false
          prometheus:
            create: false
        cert-manager:
          # `crds.enabled`, NOT `installCRDs`. The old key still exists and
          # still works, and the chart's own values.yaml marks it deprecated in
          # favour of this pair — a deprecated key that works is exactly the
          # kind that gets copied forward for years.
          crds:
            enabled: true
            # Survive an uninstall. Deleting cert-manager's CRDs deletes every
            # Certificate in the cluster along with them.
            keep: true
          # Development sizing (D55). The ceiling on this machine is the ~19
          # database instances, not the controllers.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
          webhook:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
          cainjector:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs exceed the annotation size limit client-side apply uses to store its
      # last-applied state.
      - ServerSideApply=true
    retry:
      limit: 6
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
