# Every yadgarhq repo carries pre-commit (D59).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
        # Argo CRDs and multi-document manifests.
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
  # Shared, from yadgarhq/actions (D62) — this was a near-identical local block
  # in every repository until the shared definition existed.
  # IMMUTABLE rev, unlike the @v1 the workflow caller pins. pre-commit caches a
  # rev at first install and never re-resolves it — "mutable references are never
  # updated after first install and are not supported" — so a moving tag here
  # would silently freeze each machine at whatever v1 meant the day it first ran.
  # GitHub Actions re-resolves @v1 every run; pre-commit does not. Bump with
  # `pre-commit autoupdate`.

  - repo: https://github.com/yadgarhq/actions
    rev: v1.20.1
    hooks:
      - id: gitleaks
      - id: prettier
      # No Containerfile here yet; the hook is a no-op until one arrives, which is
      # cheaper than remembering to add it on the day it does.
      - id: hadolint
      # A CONSUMER IS NOT LINTED UNTIL IT REFERENCES THE HOOK, which is why this
      # line exists rather than being inherited. This repository has a
      # `.github/workflows/` and nothing read it: `ci-pr.yaml` installs the
      # `actionlint` binary unconditionally and `yadgarhq/actions` publishes the
      # hook, but publication makes a check AVAILABLE rather than switching it on
      # (ledger 620, ADR-0577).
      #
      # The hook REFUSES rather than passes when actionlint's shellcheck rule
      # class is not running: actionlint silently disables that whole class when
      # the binary is absent, and "Passed, having checked nothing" is the defect
      # the guard closes rather than a state this check may report.
      - id: actionlint
      - id: no-test-skips

  # LOCAL, BECAUSE ONLY THIS REPOSITORY HAS ANYTHING TO SAY HERE. `versions/`
  # exists nowhere else, so a shared definition in yadgarhq/actions would be a
  # hook that is a no-op in every other repository. D62 puts SHARED CI in one
  # place; this check is not shared.
  #
  # THE HOOKS ARE WHERE A GATE BECOMES LOAD-BEARING. `ci-pr.yaml`'s `precommit`
  # job is "ONE definition of 'is this repository clean'", it runs every hook in
  # this file, and it feeds the required status check `ci / passed` — the only
  # merge gate this repository has, since its `main` ruleset requires zero
  # approving reviews. A workflow of its own would be a red cross that nothing
  # requires anybody to clear.
  - repo: local
    hooks:
      - id: versions-pinned
        name: a module that has released stays pinned to a digest (ledger 608)
        entry: python3 scripts/versions_pinned.py
        language: python
        # PyYAML is not in the standard library and is not guaranteed on the
        # runner — the shared `portability` job installs it for the same reason.
        # `language: python` builds this hook its own environment, so what CI
        # runs is what a developer runs.
        additional_dependencies: ["pyyaml==6.0.3"]
        # THE ABSENCE OF A FILE IS THE FAILURE, so the changed-file list cannot
        # be the input. pre-commit passes the files that CHANGED and never a
        # deleted one, which is exactly the case this gate exists to catch.
        always_run: true
        pass_filenames: false

      # E3 OF THE OPERATORS HANDOVER (ADR-0824). The six operator Applications
      # under `applications/` were adopted from the specs `yadgarhq/deploy`
      # released, and root must select them, adopt them by name and find no
      # `Prune=false`. A HOOK, for the reason `versions-pinned` gives above:
      # this is what feeds `ci / passed`. `always_run` because a deleted file is
      # a failure, and pre-commit never passes a deleted file.
      #
      # LEDGER 1211. This hook's name used to end "equal deploy's last copy".
      # `PINNED_SPECS` (scripts/tests/test_operator_applications.py) is empty
      # now and all five remaining Applications source `platform` (D4-D7.3), so
      # nothing here is still compared against deploy's copy — the name was
      # false. The hook id is unchanged, because nothing references the name.
      #
      # RETIRING `infra` (ADR-0828) ADDED TWO OFFLINE FILES TO `scripts/tests`,
      # and this hook runs them as it runs the rest: `test_infra_children.py`
      # (the five Applications root adopted from `infra`, S0 shape) and
      # `test_check_chart_pin.py`. The gates that need helm or the network live
      # in `scripts/gates/` and run in CI's `two-owners` job, never here.
      - id: operator-applications
        name: the adopted Applications are pinned — operators D4+, infra's children S0 (ADR-0824, ADR-0828)
        entry: python -m pytest scripts/tests -q
        language: python
        additional_dependencies: ["pytest==9.1.1", "pyyaml==6.0.3"]
        always_run: true
        pass_filenames: false

      # PORTED FROM yadgarhq/deploy WITH THEIR SUBJECTS (retiring `infra`,
      # option A, ADR-0828). Local for the reason `versions-pinned` gives: the
      # subjects exist in this repository only. `always_run` because a deleted
      # subject is the failure, and pre-commit never passes a deleted file.
      #
      # `applications/estate-front-runner.yaml`'s runner image stays pinned to
      # a digest. The signature half needs the registry, so it is CI's
      # `signature` job, not this hook.
      - id: runner-image-pinned
        name: the ARC runner pod is pinned to a digest CI published (ledger 742)
        entry: python scripts/runner_image_pinned.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        always_run: true
        pass_filenames: false

      # `manifests/estate-front/networkpolicy.yaml`'s `estate-front-egress` is
      # the subject; the script walks the whole tree.
      - id: policy-sources-named
        name: every ingress rule names a source (ledger 897)
        entry: python scripts/policy_sources_named.py
        language: python
        additional_dependencies: ["pyyaml==6.0.3"]
        always_run: true
        pass_filenames: false
