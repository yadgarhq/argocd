# Argo CD's own install values. Argo manages Argo: this chart is applied once by
# hand to bootstrap, then an Application in projects/ points back here so every
# subsequent change arrives the same way as everything else.
#
# ADOPTED, 2026-10-02. `applications/argocd.yaml` is deliberately not
# `automated`, but its FIRST sync has now run: by hand, `argocd app sync
# argocd --core --kube-context kind-yadgar` under a throwaway kubeconfig
# minified to the `kind-yadgar` context with its namespace set to `argocd`
# (the form in MIGRATION_NOTES.md's ledger-1224 "Apply" step), right after
# argocd#56 (`f4da219`) merged. It Succeeded and recreated
# `argocd-application-controller`, `argocd-repo-server`,
# `argocd-server` and `argocd-applicationset-controller`; `argocd-redis` was
# untouched. Before that sync (measured 2026-09-06), all 33 of the
# Application's resources read OutOfSync, and the live `argocd-cm` still
# carried the chart's own `timeout.reconciliation: 180s` against the `60s` set
# here — a value added to this file changed nothing on its own. It does now:
# this Application is adopted, and a value reaches the cluster the next time
# an operator syncs it (MIGRATION_NOTES.md holds that step for each value).
# The ruling that led to running the first sync is
# `plans/argocd-adoption-sync.md` in yadgarhq/docs.
#
# Chart: argo-cd from https://argoproj.github.io/argo-helm

configs:
  params:
    # NOTHING TERMINATES TLS IN FRONT OF ARGO'S OWN CONSOLE. It is reached by
    # `kubectl --context kind-yadgar -n argocd port-forward svc/argocd-server`
    # (deploy/Makefile) and by no other route: the kind node publishes
    # 18080/18443 for the yadgar edge only, and Argo has no Ingress and no
    # Gateway route. The earlier text here named a k3d loadbalancer; k3d was
    # abandoned before this cluster was built — see `deploy/Makefile`'s
    # header — so it terminated nothing.
    server.insecure: true
    # END A SYNC THAT NEVER ENDS (ledger 1208). v3.1.8's default, "0", never
    # times out, so a PreSync hook Job whose image cannot be pulled holds its
    # operation Running for ever and `retry` never fires. After this many seconds
    # from the operation's start the controller deletes its running hooks and
    # marks it Failed.
    #
    # THE CLOCK COVERS THE WHOLE OPERATION, retries and backoff included
    # (`controller/appcontroller.go:1420-1424` and `:1429`, v3.1.8), so the value
    # must outlast the longest retry chain of any automated Application here.
    # `yadgar` is the longest: limit 6, 15s x2, max 5m is 1050 s of backoff and
    # 7 attempts. FORWARD-LOOKING (ledger 1224): `yadgarhq/platform#24` is open,
    # not merged, and adds `activeDeadlineSeconds` plus a grace margin to the
    # four estate hook Jobs — preflight 1260 + 60, envoy-gateway-probe 1200 + 45,
    # and the bootstrap Jobs' own deadline (450 in this org, `iamKeys.create:
    # false`) + 30 default grace — plus the unbounded wait for Sync-phase health
    # (3x the 90 s measured) at 270 s: 3315 s. 1050 + 7 x 3315 = 24255 s, this
    # repo's own floor. ADR-0830 holds ONE value across this org and the chart's
    # kind installs; the chart's own floor is 24755 (`iamKeys.create: true` there,
    # bootstrap deadline 500), so 25200 s (7 h) clears both, raised ahead of
    # platform#24 merging because its release lands with no PR CI. Max ruled
    # 2026-10-01: honest numbers now, tightened through per-hook deadlines
    # (ledger 1224, yadgarhq/platform#24). Argo reads the value as an int32 and
    # treats a larger one as 0.
    # `scripts/tests/test_install_values.py` derives the floor.
    #
    # 24000 REACHED THE LIVE CLUSTER BY A HAND `kubectl patch` OF
    # `argocd-cmd-params-cm` PLUS A CONTROLLER RESTART (ledger 1208,
    # 2026-10-01) — `Application/argocd` was not yet adopted then. It is
    # adopted now (see the header), so 25200 is set by syncing that
    # Application instead: MIGRATION_NOTES.md, ledger 1224.
    controller.sync.timeout.seconds: "25200"
  cm:
    # HOW ARGO MARKS WHAT IT OWNS — the `argocd.argoproj.io/tracking-id`
    # annotation rather than an `app.kubernetes.io/instance`-style label. The
    # earlier text here described D54's SCM Provider generator, which is a
    # different mechanism in a different file (`applicationsets/modules.yaml`)
    # and is not affected by this key.
    #
    # A PIN, NOT A CHANGE. Measured 2026-09-06 against Argo CD v3.1.8 with this
    # key absent from the live ConfigMap: every module resource already carries
    # a `tracking-id` annotation (`gateway:apps/Deployment:yadgar/gateway`) and
    # none carries the instance label, so annotation tracking is already what
    # runs. Kept because a chart bump that moved the default would silently
    # re-key ownership of every resource in the estate.
    application.resourceTrackingMethod: annotation
    timeout.reconciliation: 60s

    # THE ONE KIND IN THIS ESTATE ARGO HAS NO OPINION ABOUT (ledger 745).
    # `actions.github.com` is a CRD group Argo CD v3.1.8 ships no health check
    # for, and its fallback is "the object exists, therefore Healthy". Measured
    # 2026-09-06: `Application/estate-front-runner` reads Synced AND Healthy
    # while its `AutoscalingRunnerSet` carries no health status at all, so the
    # whole Application is green on the strength of four objects existing.
    # ADR-0580 already recorded the consequence — a scale set with no
    # credential, and therefore no runner, is indistinguishable from a working
    # idle one, and the only evidence is a line in a controller log in another
    # namespace.
    #
    # IT READS `.status.phase` AND NOT THE `STATE` COLUMN, and that distinction
    # is the whole trap. `kubectl --context kind-yadgar -n estate-front get
    # autoscalingrunnersets` prints a `STATE` column, which is a PRINTER COLUMN
    # reading `.status.state` — a field that does not exist. It is absent from
    # the CRD's own status schema (which
    # declares `currentRunners`, `failedEphemeralRunners`,
    # `pendingEphemeralRunners`, `phase`, `runningEphemeralRunners` and nothing
    # else) and absent from `AutoscalingRunnerSetStatus` in ARC 0.14.2's Go
    # source. The column is therefore always EMPTY, which is exactly what the
    # live cluster prints. A rule written against what the table shows would
    # read `nil` forever and report every scale set unhealthy.
    #
    # THE THREE PHASES ARE THE CONTROLLER'S, read out of
    # `autoscalingrunnerset_controller.go` at tag `gha-runner-scale-set-0.14.2`
    # rather than guessed: `Pending` is written when a spec change is accepted,
    # `Running` only after the reconcile reaches "the AutoscalingListener
    # exists", and `Outdated` while an old ephemeral runner set drains. An
    # object the controller has never touched carries no phase at all.
    #
    # PROGRESSING RATHER THAN DEGRADED for every non-Running phase. All three
    # are states a healthy scale set passes through within seconds of any edit,
    # and a rule that goes red on a legitimate change is one an operator learns
    # to ignore — the same reason Argo calls a rolling Deployment Progressing.
    # What this buys is precise and it is enough: the Application stops reading
    # Healthy while the runner cannot run a job.
    #
    # ZERO RUNNERS IS HEALTHY, DELIBERATELY. `minRunners: 0` is the design
    # (deploy/infra/estate-front-runner.yaml), so an idle cluster has no runner
    # pod and must not be red. The count is reported in the message and judged
    # by nothing. `failedEphemeralRunners` was considered as a Degraded trigger
    # and rejected: ARC retains a failed ephemeral runner for inspection, so one
    # bad job would pin the Application red until somebody deleted the object.
    #
    # WHAT IT DOES NOT CATCH, said here rather than left to be found. `Running`
    # means the AutoscalingListener RESOURCE exists — not that its pod is
    # working. A listener that exists and crash-loops leaves this rule reporting
    # Healthy. That case is not reachable from this object at all: the listener
    # lives in `arc-systems`, carries no ownerReferences, and does not appear in
    # the Application's resource list, so no Argo health rule can see it. Its
    # home is an alert on the listener pod beside `deploy/infra/prometheus.yaml`,
    # and it is not built here.
    #
    # NO RULE FOR `AutoscalingListener`, for the same reason. Its CRD status
    # schema is `type: object` with NO properties, so every field the controller
    # writes is pruned by the API server and `.status` is permanently `{}`.
    # There is nothing for a rule to read.
    resource.customizations.health.actions.github.com_AutoscalingRunnerSet: |
      hs = {}
      if obj.status == nil or obj.status.phase == nil or obj.status.phase == "" then
        hs.status = "Progressing"
        hs.message = "no .status.phase: the ARC controller has not reconciled this scale set. It is not registered with GitHub and no listener exists, so a dispatched job waits forever."
        return hs
      end
      if obj.status.phase == "Running" then
        local runners = obj.status.currentRunners or 0
        hs.status = "Healthy"
        hs.message = "phase Running: the listener exists and " .. tostring(runners) .. " runner(s) are up."
        if runners == 0 then
          hs.message = hs.message .. " Zero is the correct idle state under minRunners: 0."
        end
        return hs
      end
      if obj.status.phase == "Pending" then
        hs.status = "Progressing"
        hs.message = "phase Pending: the controller has accepted a change but has not reached a listener. A scale set that stays here is not registering with GitHub -- check the arc-systems controller log for the githubConfigSecret."
        return hs
      end
      if obj.status.phase == "Outdated" then
        hs.status = "Progressing"
        hs.message = "phase Outdated: the spec changed and the controller is draining the old ephemeral runner set before replacing it."
        return hs
      end
      hs.status = "Progressing"
      hs.message = "unrecognised .status.phase " .. tostring(obj.status.phase) .. ": this rule knows Running, Pending and Outdated. Not Healthy, deliberately -- an unknown phase is the case the rule cannot judge."
      return hs

    # THE CHART'S TWO HEALTH OVERRIDES, COPIED, NOT WRITTEN HERE (ledger 1221).
    # `yadgarhq/chart`'s kind bootstrap (`bootstrap/argocd-values.yaml`)
    # replaces two of Argo CD v3.1.8's built-in health scripts. This Argo syncs
    # the same Applications, so it needs the same two scripts. Both are copied
    # byte for byte from `yadgarhq/chart` v0.3.18. The reasoning, the upstream
    # digests and the Lua cases live there, in `bootstrap/argocd-values.yaml`
    # and `scripts/tests/test_argocd_values.py`. Do not edit either script
    # here: copy it again from the chart.
    # `scripts/tests/test_install_health_overrides.py` pins both scripts to the
    # chart's digests (`scripts/tests/fixtures/chart_health_overrides.json`).
    #
    # CRD (chart#21, ledger 1197). gitops-engine fails a running sync task
    # whose live object is Degraded. v3.1.8 reads a new CRD as Degraded, "CRD is
    # not established", in two states: `Established=False, reason=Installing`,
    # and conditions that hold no `Established` entry yet (the gateway-api CRDs
    # get `KubernetesAPIApprovalPolicyConformant` about 2 s first). This is
    # upstream's fixed script plus three hunks named `hasEstablishedCondition`:
    # both states read Progressing. Delete the key when the Argo CD here ships
    # a built-in script that reads both states as Progressing.
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition:
      |
      local hs = {}

      -- Check if CRD is terminating
      if obj.metadata.deletionTimestamp ~= nil then
          hs.status = "Progressing"
          hs.message = "CRD is terminating"
          return hs
      end

      if obj.status.conditions == nil then
          hs.status = "Progressing"
          hs.message = "Status conditions not found"
          return hs
      end

      if #obj.status.conditions == 0 then
          hs.status = "Progressing"
          hs.message = "Status conditions not found"
          return hs
      end

      local isEstablished
      -- NOT UPSTREAM (yadgarhq/chart, ledger 1197; argoproj/argo-cd#26346): a CRD
      -- whose conditions hold no Established entry yet reads Progressing, not
      -- Degraded. gateway-api CRDs get KubernetesAPIApprovalPolicyConformant first.
      local hasEstablishedCondition = false
      local conditionMsg = ""

      for _, condition in pairs(obj.status.conditions) do

          -- Check if CRD is terminating
          if condition.type == "Terminating" and condition.status == "True" then
              hs.status = "Progressing"
              hs.message = "CRD is terminating: " .. condition.message
              return hs
          end

          -- Check if K8s has accepted names for this CRD
          if condition.type == "NamesAccepted" and condition.status == "False" then
              hs.status = "Degraded"
              hs.message = "CRD names have not been accepted: " .. condition.message
              return hs
          end

          -- Checking if CRD has violations
          if condition.type == "NonStructuralSchema" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = "Schema violations found: " .. condition.message
              return hs
          end

          -- Checking if CRD is established
          if condition.type == "Established" then
              hasEstablishedCondition = true
              if condition.status == "True" then
                  isEstablished = true
                  conditionMsg = condition.message
              elseif condition.reason == "Installing" then
                  hs.status = "Progressing"
                  hs.message = "CRD is being installed"
                  return hs
              end
          end
      end

      if not isEstablished then
          if not hasEstablishedCondition then
              hs.status = "Progressing"
              hs.message = "CRD is being installed"
              return hs
          end
          hs.status = "Degraded"
          hs.message = "CRD is not established"
          return hs
      end

      hs.status = "Healthy"
      hs.message = "CRD is healthy"
      return hs
    # MariaDB (chart#22, ledger 1205). mariadb-operator 26.6.0 creates the
    # `<name>-mariadb-sys-global-priv` Grant and reads it back at once from a
    # cache that can lag the create. The NotFound becomes `Ready=False,
    # reason=Failed`, which v3.1.8 reads as Degraded, and the running sync
    # fails. This is upstream's script plus one hunk, marked NOT UPSTREAM:
    # exactly that message, for this MariaDB's own Grant, reads Progressing.
    # Every other `reason=Failed` stays Degraded. Delete the key when the
    # operator reads that Grant uncached or wraps the error with `%w`.
    resource.customizations.health.k8s.mariadb.com_MariaDB: |
      local health_status = {}

      if obj.status ~= nil and obj.status.conditions ~= nil then

          for i, condition in ipairs(obj.status.conditions) do

              health_status.message = condition.message

              if condition.status == "False" then
                  if condition.reason == "Failed" then
                      -- NOT UPSTREAM (yadgarhq/chart, ledger 1205): mariadb-operator 26.6.0
                      -- reads the mariadb.sys Grant it has just created from a lagging cache.
                      -- That one NotFound, for this MariaDB's own Grant, reads Progressing.
                      if condition.type == "Ready" and obj.metadata ~= nil and obj.metadata.name ~= nil
                          and condition.message ==
                          'Error reconciling SQL: error getting mariadb.sys Grant: Grant.k8s.mariadb.com "'
                          .. obj.metadata.name .. '-mariadb-sys-global-priv" not found' then
                          health_status.status = "Progressing"
                          return health_status
                      end
                      health_status.status = "Degraded"
                      return health_status
                  end
                  health_status.status = "Progressing"
                  return health_status
              end
          end

          health_status.status = "Healthy"
          return health_status
      end

      health_status.status = "Progressing"
      health_status.message = "No status info available"
      return health_status

controller:
  # One replica in development. Production sizing is a values override, not a
  # different manifest.
  replicas: 1

applicationSet:
  # The SCM Provider generator lives here (D54). Without this component the
  # module repos are never discovered at all.
  enabled: true
  replicas: 1

notifications:
  enabled: false

dex:
  # No SSO in development. iam owns identity for the yadgar services themselves;
  # this is only Argo's own console.
  enabled: false
