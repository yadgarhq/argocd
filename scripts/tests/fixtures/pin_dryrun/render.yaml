# A SMALL STAND-IN FOR THE PARENT RENDER AT THE CURRENT PIN (0.25.27), for
# `scripts/tests/test_pin_dryrun.py`. One object of each shape the comparator
# must handle: a Deployment with quantities in its resources, a StatefulSet, the
# `Replace=true,Force=true` seeder Job, a ConfigMap that holds a
# quantity-looking string, a Service, a cluster-scoped GatewayClass, a
# ServiceAccount and one `helm.sh/hook` Job. `live.json` is what the API
# server returns for the same objects.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      serviceAccountName: gateway
      initContainers:
        - name: wait-for-nats
          image: ghcr.io/yadgarhq/wait:0.1.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
      containers:
        - name: gateway
          image: ghcr.io/yadgarhq/gateway:0.12.13@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          env:
            - name: GATEWAY_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 1000m
              memory: 1024Mi
            limits:
              memory: 1024Mi
          securityContext: {}
          volumeMounts: []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  replicas: 1
  serviceName: nats-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: docker.io/library/nats:2.12.1@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seeder
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seeder
          image: ghcr.io/yadgarhq/seeder:0.1.1@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared
data:
  LOG_LEVEL: info
  CPU_HINT: 1000m
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: yadgar
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
---
apiVersion: batch/v1
kind: Job
metadata:
  name: preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: preflight
          image: ghcr.io/yadgarhq/preflight:0.1.0@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
