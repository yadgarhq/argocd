# READ-ONLY, AND NO SECRETS. `scripts/verify_handover.py` reads what root's
# Applications track, and the workloads in their destination namespaces.
#
# EVERY GROUP AND RESOURCE IS NAMED. `resources: ["*"]` on the core group, or
# `apiGroups: ["*"]`, grants Secrets, and RBAC has no "everything except".
# `list` on Secrets returns their data whatever the client asks for, so the
# metadata-only Secret check in the script is for the operator's own
# kubeconfig, never for this role.
#
# THE CUSTOM RESOURCES BELOW are the instances of every CRD root's Applications
# tracked on kind-yadgar on 2026-10-01, less the ones `collect` never lists
# (cert-manager's CertificateRequests, Orders and Challenges). A CRD swap that
# goes wrong deletes these, so the snapshot records each one's uid.
#
# A TYPE MISSING HERE FAILS LOUDLY. When an Application starts tracking a kind
# this role does not name, the snapshot stops on Forbidden rather than skipping
# it. Add the kind here, in a reviewed change.
#
# `scripts/tests/test_verify_handover.py` holds this shape: read verbs only, no
# wildcard, no `secrets`, and every type the script reads on every run.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: post-merge-verifier
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - persistentvolumeclaims
      - configmaps
      - services
      - serviceaccounts
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, applicationsets, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  # Custom resources: one rule per group, every plural named.
  # The one ARC kind an Application tracks (estate-front-runner (and, from
  # A-U10's runner App, the verifier runner)); controller-created children
  # are tracked by no Application and `collect` never lists them.
  - apiGroups: [actions.github.com]
    resources: [autoscalingrunnersets]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, clusterissuers, issuers]
    verbs: [get, list, watch]
  - apiGroups: [eventing.keda.sh]
    resources: [cloudeventsources, clustercloudeventsources]
    verbs: [get, list, watch]
  - apiGroups: [keda.sh]
    resources:
      - clustertriggerauthentications
      - scaledjobs
      - scaledobjects
      - triggerauthentications
    verbs: [get, list, watch]
  - apiGroups: [gateway.envoyproxy.io]
    resources:
      - backends
      - backendtrafficpolicies
      - clienttrafficpolicies
      - envoyextensionpolicies
      - envoypatchpolicies
      - envoyproxies
      - httproutefilters
      - securitypolicies
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - backendtlspolicies
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - listenersets
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.x-k8s.io]
    resources: [xbackends, xbackendtrafficpolicies, xmeshes]
    verbs: [get, list, watch]
  - apiGroups: [k8s.mariadb.com]
    resources:
      - backups
      - connections
      - databases
      - externalmariadbs
      - grants
      - mariadbs
      - maxscales
      - physicalbackups
      - pointintimerecoveries
      - restores
      - sqljobs
      - users
    verbs: [get, list, watch]
