# The app-of-apps root, applied once during bootstrap. Everything else — Argo's
# own values, the ApplicationSets, the infra in yadgarhq/deploy — arrives
# through this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://github.com/yadgarhq/argocd
    targetRevision: main
    # Everything Argo needs to know about ITSELF and about how it finds work.
    # `directory.recurse` picks up both applications/ and applicationsets/, so
    # adding either is a file rather than an edit here.
    path: .
    directory:
      recurse: true
      include: "{applications,applicationsets}/*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
