# The app-of-apps root, applied once during bootstrap. Everything else — Argo's
# own values, the ApplicationSets, the infra in yadgarhq/deploy — arrives
# through this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://github.com/yadgarhq/argocd
    targetRevision: main
    # Everything Argo needs to know about ITSELF and about how it finds work.
    # `directory.recurse` picks up applications/, so adding one is a file
    # rather than an edit here. `applicationsets/` carried the same glob
    # until ledger 1270b retired the `yadgar-modules` ApplicationSet and the
    # directory with it; nothing generates one today, so the include is
    # narrowed to the directory that still exists.
    path: .
    directory:
      recurse: true
      include: "applications/*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
